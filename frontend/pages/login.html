<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — HermesPDV</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="login">
  <div class="caixa-login">
    <h1>Hermes<span>PDV</span></h1>
    <p class="sub">Sistema de ponto de venda</p>
    <form id="formLogin" novalidate>
      <label>Usuário<input name="login" autocomplete="username" required autofocus></label>
      <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <p id="erro" class="erro-form" hidden></p>
      <button class="btn primario" type="submit">Entrar</button>
    </form>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
